name: Flutter checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - name: Record golden rendering environment
        run: python3 tool/report_golden_environment.py --output build/test_reports/golden-environment.json
      - id: flutter_tests
        run: flutter test
      - name: Preserve golden failure comparisons
        if: ${{ failure() && steps.flutter_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: golden-failures-${{ runner.os }}
          path: |
            test/failures/*.png
            build/test_reports/golden-environment.json
          retention-days: 1
          compression-level: 9
          include-hidden-files: false
          if-no-files-found: warn
      - name: Reviewed five-subject release regressions without live services
        run: >-
          flutter test --concurrency=1
          --dart-define=REVIEWED_MOBILE_RELEASE=true
          --dart-define=API_URL=https://staging.example.test
          test/integrated_beta_test.dart
          test/reviewed_mobile_release_test.dart
          test/subject_grade_availability_test.dart
          test/catalogue_deadline_test.dart
          test/release_visual_audit_test.dart
          test/assessment_feedback_text_test.dart
          test/study_help_test.dart
      - run: flutter build web --no-pub --no-web-resources-cdn --no-wasm-dry-run
